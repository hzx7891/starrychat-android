        <h2>1. 引言</h2>
        <p>我们深知保护儿童个人信息的重要性。本规则适用于不满 14 周岁的未成年人（以下简称"儿童"）使用星迹 StarryChat 平台的情况。</p>

        <h2>2. 我们如何处理儿童信息</h2>
        <p>本平台不面向儿童提供服务。如果我们发现用户为儿童，我们会停止收集其个人信息，并删除已收集的信息。建议儿童在监护人指导下使用互联网。</p>

        <h2>3. 监护人权利</h2>
        <p>监护人有权要求我们删除儿童的账号和个人信息。如需行使此权利，请联系管理员。</p>
