        function showRegister() { document.getElementById('loginBox').style.display = 'none'; document.getElementById('regBox').style.display = 'block'; }
        function showLogin() { document.getElementById('regBox').style.display = 'none'; document.getElementById('loginBox').style.display = 'block'; }

        function checkMaintenance() {
            try { if (localStorage.getItem('maintenance_mode') === 'true') { alert('🔧 系统正在维护中，请稍后再来'); return true; } } catch (_) {}
            return false;
        }

        async function login() {
            if (checkMaintenance()) return;
            const u = document.getElementById('loginUser').value.trim();
            const p = document.getElementById('loginPassword').value;
            const remember = document.getElementById('rememberMe').checked;
            const btn = document.getElementById('loginBtn');
            const errEl = document.getElementById('loginError');
            if (!u || !p) { errEl.innerText = '用户名或密码错误'; return; }

            btn.innerHTML = '<span class="spinner"></span> 登录中...';
            btn.disabled = true;
            errEl.innerText = '';

            try {
                const { data, error } = await db.from('users')
                    .select('username, avatar, signature, password_hash, is_banned, ban_reason')
                    .eq('username', u).single();

                if (error || !data) { errEl.innerText = '用户名或密码错误'; return; }
                if (data.is_banned) { errEl.innerText = '账号已被封禁：' + (data.ban_reason || '违规操作'); return; }
                if (!verifyPassword(p, data.password_hash)) { errEl.innerText = '用户名或密码错误'; return; }

                currentUser = { username: data.username, avatar: data.avatar || '', signature: data.signature || '' };
                isAdmin = data.username === 'hzx7891';

                // 记录日志
                try {
                    const deviceInfo = navigator.userAgent || '未知设备';
                    await db.from('login_logs').insert({ username: u, device: deviceInfo, created_at: new Date().toISOString() });
                    await db.from('users').update({ last_login_at: new Date().toISOString(), last_device: deviceInfo }).eq('username', u);
                } catch (logErr) { console.warn('日志记录失败', logErr); }

                // 记住我
                if (remember) {
                    try {
                        const token = UUID();
                        const deviceFingerprint = getDeviceFingerprint();
                        const expires = new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString();
                        await db.from('users').update({
                            remember_token: token, remember_expires: expires, remember_device: deviceFingerprint
                        }).eq('username', u);
                        localStorage.setItem('starry_remember', token);
                        localStorage.setItem('starry_device', deviceFingerprint);
                    } catch (tokenErr) {
                        console.warn('记住我写入失败', tokenErr);
                        localStorage.removeItem('starry_remember');
                        localStorage.removeItem('starry_device');
                    }
                } else {
                    localStorage.removeItem('starry_remember');
                    localStorage.removeItem('starry_device');
                    await db.from('users').update({ remember_token: null, remember_expires: null }).eq('username', u);
                }

                if (!currentUser.signature && !currentUser.avatar) { showSignaturePage(); return; }
                enterChat();
            } catch (err) {
                errEl.innerText = '网络错误，请重试';
                console.error(err);
            } finally {
                btn.innerHTML = '登录';
                btn.disabled = false;
            }
        }

        async function register() {
            if (checkMaintenance()) return;
            const u = document.getElementById('regUsername').value.trim();
            const p = document.getElementById('regPassword').value;
            const btn = document.getElementById('regBtn');
            const errEl = document.getElementById('regError');
            if (!u || !p) { errEl.innerText = '请填写完整信息'; return; }
            if (u.length < 2) { errEl.innerText = '用户名至少2个字符'; return; }
            if (p.length < 4) { errEl.innerText = '密码至少4个字符'; return; }

            btn.innerHTML = '<span class="spinner"></span> 注册中...';
            btn.disabled = true;
            errEl.innerText = '';

            try {
                const { data: existing } = await db.from('users').select('username').eq('username', u).single();
                if (existing) { errEl.innerText = '用户名已存在'; return; }
                const hashedPassword = hashPassword(p);
                await db.from('users').insert({ username: u, password_hash: hashedPassword, avatar: '', signature: '', is_banned: false });
                alert('🎉 注册成功！请登录');
                showLogin();
                document.getElementById('loginUser').value = u;
                document.getElementById('loginPassword').value = '';
            } catch (err) {
                errEl.innerText = '注册失败，请重试';
                console.error(err);
            } finally {
                btn.innerHTML = '注册';
                btn.disabled = false;
            }
        }

        // ===== 修复：记住我自动登录，放宽设备检查 =====
        async function autoLogin() {
            if (checkMaintenance()) {
                document.getElementById('welcomePage').style.display = 'flex';
                runTypeWriter();
                return;
            }
            const savedToken = localStorage.getItem('starry_remember');
            if (savedToken) {
                try {
                    const { data, error } = await db.from('users')
                        .select('username, avatar, signature, remember_expires, remember_device, is_banned')
                        .eq('remember_token', savedToken).single();
                    if (data && !error && data.remember_expires && new Date(data.remember_expires).getTime() > Date.now()) {
                        const savedDevice = localStorage.getItem('starry_device');
                        // 只在两个值都存在且不匹配时拒绝
                        if (data.remember_device && savedDevice && data.remember_device !== savedDevice) {
                            localStorage.removeItem('starry_remember');
                            localStorage.removeItem('starry_device');
                            document.getElementById('welcomePage').style.display = 'flex';
                            runTypeWriter();
                            return;
                        }
                        if (data.is_banned) {
                            localStorage.removeItem('starry_remember');
                            localStorage.removeItem('starry_device');
                            alert('⛔ 账号已被封禁');
                            document.getElementById('welcomePage').style.display = 'flex';
                            runTypeWriter();
                            return;
                        }
                        currentUser = { username: data.username, avatar: data.avatar || '', signature: data.signature || '' };
                        isAdmin = data.username === 'hzx7891';
                        if (!currentUser.signature && !currentUser.avatar) { showSignaturePage(); return; }
                        enterChat();
                        return;
                    }
                } catch (_) {}
                localStorage.removeItem('starry_remember');
                localStorage.removeItem('starry_device');
            }
            document.getElementById('welcomePage').style.display = 'flex';
            runTypeWriter();
        }

        // ============================================================
        // 进入聊天（修复：正确初始化所有模块）
        // ============================================================
        function enterChat() {
            document.getElementById('authPage').style.display = 'none';
            document.getElementById('welcomePage').style.display = 'none';
            document.getElementById('signaturePage').style.display = 'none';
            document.getElementById('chatApp').style.display = 'flex';

            const avatarUrl = getAvatarUrl(currentUser.username, currentUser.avatar);
            document.getElementById('myAvatar').src = avatarUrl;

            const roomFromURL = detectRoomFromURL();
            const targetRoom = roomFromURL || '大厅';
            checkAndSwitchRoom(targetRoom);

            startBanMonitoring();
            startMaintenanceMonitoring();
            setupGlobalChannel();
            startMemberRefresh();
            subscribeRooms();

            setTimeout(() => { document.getElementById('messageInput').focus(); }, 300);
        }

        // ===== 修复：URL 路由，固定 /starrychat/ 前缀 =====
        async function checkAndSwitchRoom(roomName) {
            try {
                const { data } = await db.from('messages').select('room').eq('room', roomName).limit(1);
                if (data && data.length > 0) {
                    currentRoom = roomName;
                    loadRooms();
                    await loadMessages(roomName, true);
                    subscribeToMessages();
                    subscribePrivateMessages();
                    subscribeCalls();
                    updateMemberList();

                    document.getElementById('chatRoomName').textContent = roomName === '大厅' ? '🏠 大厅' : '🔒 ' + roomName;

                    // 更新 URL：使用 /starrychat/ 前缀
                    const basePath = '/starrychat';
                    const newUrl = roomName !== '大厅' ? basePath + '/' + encodeURIComponent(roomName) : basePath + '/';
                    window.history.pushState({ room: roomName }, '', newUrl);

                    document.querySelectorAll('.room-item').forEach(el => {
                        el.classList.toggle('active', el.textContent.includes(roomName));
                    });

                    // 清除残留的 path 参数
                    const url = new URL(window.location);
                    if (url.searchParams.has('path')) {
                        url.searchParams.delete('path');
                        window.history.replaceState({}, '', url.toString());
                    }
                } else {
                    document.getElementById('chatMessages').innerHTML = `
                        <div class="room-not-found">
                            <div class="icon">🌌</div>
                            <h2>房间不存在</h2>
                            <p>房间 "${escapeHtml(roomName)}" 还没被创建</p>
                            <button class="btn btn-primary" onclick="checkAndSwitchRoom('大厅')">返回大厅</button>
                        </div>
                    `;
                    document.getElementById('chatRoomName').textContent = '❌ 未找到';
                    loadRooms();
                    setTimeout(() => { checkAndSwitchRoom('大厅'); }, 3000);
                }
            } catch (err) {
                console.error('切换房间失败', err);
            }
        }

        // ============================================================
        // 监控和订阅
        // ============================================================
        function stopBanMonitoring() {
            if (banCheckInterval) { clearInterval(banCheckInterval); banCheckInterval = null; }
            if (banSubscription) { try { db.removeChannel(banSubscription); } catch (_) {} banSubscription = null; }
        }
        function stopMaintenanceMonitoring() {
            if (maintenanceCheckInterval) { clearInterval(maintenanceCheckInterval); maintenanceCheckInterval = null; }
        }
        function startMaintenanceMonitoring() {
            stopMaintenanceMonitoring();
            maintenanceCheckInterval = setInterval(() => {
                try { if (localStorage.getItem('maintenance_mode') === 'true') { alert('🔧 系统已进入维护模式，即将退出'); logout(); } } catch (_) {}
            }, 10000);
        }
        function startBanMonitoring() {
            stopBanMonitoring();
            banCheckInterval = setInterval(async () => {
                try {
                    const { data } = await db.from('users').select('is_banned').eq('username', currentUser.username).single();
                    if (data && data.is_banned) { alert('⛔ 你的账号已被封禁'); logout(); }
                } catch (_) {}
            }, 7891);
            banSubscription = db.channel('user-ban-' + currentUser.username)
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'users', filter: 'username=eq.' + currentUser.username }, payload => {
                    if (payload.new && payload.new.is_banned) { alert('⛔ 你的账号已被封禁'); logout(); }
                }).subscribe();
        }

        function subscribeRooms() {
            if (roomSubscription) { try { db.removeChannel(roomSubscription); } catch (_) {} }
            roomSubscription = db.channel('room-list-refresh')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                    const newRoom = payload.new.room;
                    if (newRoom && !currentRoomList.includes(newRoom)) {
                        currentRoomList.push(newRoom);
                        loadRooms();
                    }
                })
                .subscribe();
        }

        // ===== 修复：删除房间广播 =====
        function setupGlobalChannel() {
            if (globalChannel) { try { db.removeChannel(globalChannel); } catch (_) {} }
            globalChannel = db.channel('global-updates');
            globalChannel
                .on('broadcast', { event: 'room_deleted' }, (payload) => {
                    if (payload.room) {
                        loadRooms();
                        if (currentRoom === payload.room) {
                            checkAndSwitchRoom('大厅');
                        }
                    }
                })
                .subscribe();
        }

        // ===== 修复：成员刷新 30秒 =====
        function startMemberRefresh() {
            if (memberRefreshInterval) clearInterval(memberRefreshInterval);
            memberRefreshInterval = setInterval(() => { updateMemberList(); }, 30000);
        }

        function logout() {
            stopBanMonitoring();
            stopMaintenanceMonitoring();
            if (memberRefreshInterval) { clearInterval(memberRefreshInterval); memberRefreshInterval = null; }
            if (globalChannel) { try { db.removeChannel(globalChannel); } catch (_) {} globalChannel = null; }
            if (roomSubscription) { try { db.removeChannel(roomSubscription); } catch (_) {} roomSubscription = null; }
            hangUp();
            currentUser = { username: '', avatar: '', signature: '' };
            isAdmin = false;
            localStorage.removeItem('starry_remember');
            localStorage.removeItem('starry_device');
            document.getElementById('chatApp').style.display = 'none';
            document.getElementById('authPage').style.display = 'flex';
            wsChannels.forEach(ch => { try { db.removeChannel(ch); } catch (_) {} });
            wsChannels = [];
            if (pc) { pc.close(); pc = null; }
            if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
            document.getElementById('videoCallModal').classList.remove('active');
            document.getElementById('videoCallModal').style.display = 'none';
            document.getElementById('remoteVideo').srcObject = null;
            document.getElementById('localVideo').srcObject = null;
            currentPage = 0;
            hasMoreMessages = true;
            oldestMessageCreatedAt = null;
        }

        // ============================================================
        // 房间管理
        // ============================================================
        async function loadRooms() {
            const list = document.getElementById('roomList');
            let rooms = ['大厅'];
            const { data } = await db.from('messages').select('room, room_owner').order('created_at', { ascending: false }).limit(1000);
            if (data) {
                const roomSet = new Set();
                data.forEach(m => { if (m.room) roomSet.add(m.room); if (m.room && m.room_owner) roomOwners[m.room] = m.room_owner; });
                roomSet.forEach(r => { if (r !== '大厅') rooms.push(r); });
            }
            currentRoomList = rooms;
            list.innerHTML = '';
            rooms.forEach(room => {
                const div = document.createElement('div');
                div.className = 'room-item' + (room === currentRoom ? ' active' : '');
                const isOwner = room !== '大厅' && roomOwners[room] === currentUser.username;
                const ownerLabel = isOwner ? ' 👑' : '';
                div.innerHTML = `
                    <span>${room === '大厅' ? '🏠' : '🔒'} ${escapeHtml(room)}${ownerLabel}</span>
                    ${room !== '大厅' ? `<span class="room-actions">${isOwner || isAdmin ? `<button class="delete-room-btn" data-room="${escapeHtml(room)}" title="删除房间">✕</button>` : ''}</span>` : ''}
                `;
                const deleteBtn = div.querySelector('.delete-room-btn');
                if (deleteBtn) {
                    deleteBtn.addEventListener('click', function(e) { e.stopPropagation(); deleteRoom(this.dataset.room); });
                }
                div.addEventListener('click', function(e) { if (e.target.closest('.room-actions')) return; checkAndSwitchRoom(room); });
                list.appendChild(div);
            });
        }

        function switchRoom(room) { checkAndSwitchRoom(room); }

        async function showCreateRoom() {
            const name = prompt('🏷️ 输入房间名：');
            if (name && name.trim()) {
                const roomName = name.trim();
                let exists = false;
                document.querySelectorAll('.room-item').forEach(el => { if (el.textContent.includes(roomName)) exists = true; });
                if (!exists) {
                    roomOwners[roomName] = currentUser.username;
                    await db.from('messages').insert({
                        room: roomName, username: '🛡️ 系统', content: '✨ 房间 "' + roomName + '" 已创建！欢迎来聊天～',
                        type: 'text', avatar: '', room_owner: currentUser.username, created_at: new Date().toISOString()
                    });
                }
                checkAndSwitchRoom(roomName);
            }
        }

        // ===== 修复：删除房间广播给其他用户 =====
        async function deleteRoom(room) {
            if (room === '大厅') { alert('不能删除大厅'); return; }
            if (!confirm(`确认删除房间 "${room}" 及其所有消息？`)) return;
            try {
                await db.from('messages').delete().eq('room', room);
                // 广播删除事件
                try {
                    if (globalChannel) {
                        await globalChannel.send({ type: 'broadcast', event: 'room_deleted', payload: { room: room } });
                    }
                } catch (broadcastErr) { console.warn('广播失败', broadcastErr); }
                if (currentRoom === room) {
                    checkAndSwitchRoom('大厅');
                }
                alert('✅ 房间已删除');
                delete roomOwners[room];
                currentRoomList = currentRoomList.filter(r => r !== room);
                loadRooms();
            } catch (e) { alert('删除失败: ' + e.message); }
        }

        // ============================================================
        // 消息系统（修复：滚动加载、分页正确、trigger 永不隐藏）
        // ============================================================
        async function loadMessages(room, reset = true) {
            if (reset) {
                currentPage = 0;
                hasMoreMessages = true;
                oldestMessageCreatedAt = null;
                document.getElementById('chatMessages').innerHTML = '';
                const trigger = document.createElement('div');
                trigger.className = 'load-more-trigger';
                trigger.id = 'loadMoreTrigger';
                trigger.textContent = '⬆ 滚动加载更早消息';
                trigger.onclick = loadMoreMessages;
                trigger.style.display = 'block';
                document.getElementById('chatMessages').appendChild(trigger);
                setupScrollLoadMore();
            }

            const trigger = document.getElementById('loadMoreTrigger');
            if (trigger && reset) {
                trigger.innerHTML = '<span class="loader"></span> <span class="loading-text">加载中...</span>';
                trigger.className = 'load-more-trigger loading';
                trigger.style.display = 'block';
            }

            try {
                const { data, error } = await db.from('messages')
                    .select('*').eq('room', room).order('created_at', { ascending: false }).limit(PAGE_SIZE);
                if (error) { console.error('加载消息失败', error); return; }

                if (data && data.length > 0) {
                    const sorted = data.reverse();
                    oldestMessageCreatedAt = sorted[0].created_at;
                    renderMessages(sorted);
                }

                if (data && data.length < PAGE_SIZE) {
                    hasMoreMessages = false;
                    if (trigger) { trigger.textContent = '—— 已加载全部消息 ——'; trigger.className = 'load-more-trigger'; trigger.style.display = 'block'; }
                } else {
                    const { data: earlierCheck } = await db.from('messages')
                        .select('id').eq('room', room).lt('created_at', oldestMessageCreatedAt || new Date().toISOString()).limit(1);
                    if (earlierCheck && earlierCheck.length > 0) {
                        hasMoreMessages = true;
                        if (trigger) { trigger.textContent = '⬆ 滚动加载更早消息'; trigger.className = 'load-more-trigger'; trigger.style.display = 'block'; }
                    } else {
                        hasMoreMessages = false;
                        if (trigger) { trigger.textContent = '—— 已加载全部消息 ——'; trigger.className = 'load-more-trigger'; trigger.style.display = 'block'; }
                    }
                }
                const container = document.getElementById('chatMessages');
                container.scrollTop = container.scrollHeight;
            } catch (e) { console.error('加载消息异常', e); }
        }

        function renderMessages(messages) {
            const container = document.getElementById('chatMessages');
            messages.forEach(msg => {
                const div = document.createElement('div');
                renderMessageToElement(div, msg);
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }

        function renderMessageToElement(div, msg) {
            const isSelf = msg.username === currentUser.username;
            const isSystem = msg.username === '🛡️ 系统';
            if (isSystem) div.className = 'msg system-msg';
            else div.className = 'msg ' + (isSelf ? 'self' : 'other');

            const avatarUrl = getAvatarUrl(msg.username, msg.avatar);
            let contentHtml = '';
            if (msg.type === 'image') {
                contentHtml = `<img src="${escapeHtml(msg.content)}" class="msg-img" onclick="window.open('${escapeHtml(msg.content)}','_blank')" />`;
            } else if (msg.type === 'file') {
                if (isValidUrl(msg.content)) contentHtml = `<div>📄 <a href="${escapeHtml(msg.content)}" target="_blank" class="link-safe">查看文件</a></div>`;
                else contentHtml = `<div>📄 文件链接无效</div>`;
            } else {
                contentHtml = `<div class="msg-text">${safeLinkify(msg.content)}</div>`;
            }

            const timeStr = msg.created_at ? formatTime(msg.created_at) : '';
            const fullDateStr = msg.created_at ? formatFullTime(msg.created_at) : '';

            div.innerHTML = `
                <img class="avatar" src="${avatarUrl}" data-action="profile" data-username="${escapeHtml(msg.username)}" />
                <div class="msg-content">
                  <div class="msg-username">${escapeHtml(msg.username)}</div>
                  ${contentHtml}
                  <div class="msg-time">${timeStr}<span class="full-date">${fullDateStr}</span></div>
                </div>
                ${!isSystem ? `<div class="msg-actions"><button class="report-btn" data-msgid="${msg.id}" data-username="${escapeHtml(msg.username)}">🚩</button>${isSelf ? `<button class="delete-btn" data-msgid="${msg.id}">✕</button>` : ''}</div>` : ''}
            `;
        }

        document.getElementById('chatMessages').addEventListener('click', async function(e) {
            const target = e.target;
            if (target.classList.contains('report-btn')) {
                const msgId = target.dataset.msgid;
                const username = target.dataset.username;
                if (msgId && username) {
                    const reason = prompt('举报原因（选填）：');
                    if (reason !== null) {
                        try {
                            await db.from('reports').insert({ message_id: msgId, reported_user: username, reporter: currentUser.username, reason: reason || '未填写', created_at: new Date().toISOString() });
                            alert('✅ 举报已提交');
                        } catch (err) { alert('举报提交失败：' + err.message); }
                    }
                }
                return;
            }
            if (target.classList.contains('delete-btn')) {
                const msgId = target.dataset.msgid;
                if (msgId && confirm('确认删除这条消息？')) {
                    try {
                        await db.from('messages').delete().eq('id', msgId);
                        const msgEl = target.closest('.msg');
                        if (msgEl) msgEl.remove();
                    } catch (e) { alert('删除失败: ' + e.message); }
                }
                return;
            }
            if (target.classList.contains('avatar') && target.dataset.action === 'profile') {
                const username = target.dataset.username;
                if (username) showProfile(username);
                return;
            }
        });

        function renderMessage(msg) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            renderMessageToElement(div, msg);
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        // ===== 修复：滚动加载使用容器 scroll 事件 =====
        function setupScrollLoadMore() {
            const container = document.getElementById('chatMessages');
            // 移除之前的监听
            if (window._loadMoreScrollHandler) {
                container.removeEventListener('scroll', window._loadMoreScrollHandler);
            }
            window._loadMoreScrollHandler = function() {
                if (container.scrollTop < 80 && hasMoreMessages && !isLoadingMore) {
                    loadMoreMessages();
                }
            };
            container.addEventListener('scroll', window._loadMoreScrollHandler);
        }

        async function loadMoreMessages() {
            if (isLoadingMore || !hasMoreMessages) return;
            isLoadingMore = true;
            const trigger = document.getElementById('loadMoreTrigger');
            trigger.innerHTML = '<span class="loader"></span> <span class="loading-text">加载中...</span>';
            trigger.className = 'load-more-trigger loading';
            trigger.style.display = 'block';

            try {
                let query = db.from('messages').select('*').eq('room', currentRoom).order('created_at', { ascending: false }).limit(PAGE_SIZE);
                if (oldestMessageCreatedAt) query = query.lt('created_at', oldestMessageCreatedAt);

                const { data, error } = await query;
                if (error) {
                    isLoadingMore = false;
                    trigger.textContent = '⬆ 加载失败，点击重试';
                    trigger.className = 'load-more-trigger';
                    trigger.style.display = 'block';
                    return;
                }

                if (data && data.length > 0) {
                    const sorted = data.reverse();
                    oldestMessageCreatedAt = sorted[0].created_at;
                    const container = document.getElementById('chatMessages');
                    const triggerEl = document.getElementById('loadMoreTrigger');
                    const referenceNode = triggerEl.nextElementSibling;
                    sorted.forEach(msg => {
                        const div = document.createElement('div');
                        renderMessageToElement(div, msg);
                        container.insertBefore(div, referenceNode);
                    });
                    if (data.length < PAGE_SIZE) {
                        hasMoreMessages = false;
                        trigger.textContent = '—— 已加载全部消息 ——';
                        trigger.className = 'load-more-trigger';
                        trigger.style.display = 'block';
                    } else {
                        trigger.textContent = '⬆ 滚动加载更早消息';
                        trigger.className = 'load-more-trigger';
                        trigger.style.display = 'block';
                    }
                } else {
                    hasMoreMessages = false;
                    trigger.textContent = '—— 已加载全部消息 ——';
                    trigger.className = 'load-more-trigger';
                    trigger.style.display = 'block';
                }
            } catch (e) {
                trigger.textContent = '⬆ 加载失败，点击重试';
                trigger.className = 'load-more-trigger';
                trigger.style.display = 'block';
            }
            isLoadingMore = false;
        }

        function subscribeToMessages() {
            wsChannels = wsChannels.filter(ch => {
                if (ch.topic && ch.topic.includes('public:messages')) { try { db.removeChannel(ch); } catch (_) {} return false; }
                return true;
            });

            const ch = db.channel('public:messages-' + currentRoom)
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: 'room=eq.' + currentRoom }, payload => {
                    const msg = payload.new;
                    if (msg.room === currentRoom) {
                        renderMessage(msg);
                        if (msg.username !== currentUser.username) playSound();
                    }
                    if (msg.room && !currentRoomList.includes(msg.room)) {
                        currentRoomList.push(msg.room);
                        loadRooms();
                    }
                })
                .subscribe();
            wsChannels.push(ch);
        }

        // ============================================================
        // 发送消息（修复：AI 入库、上下文）
        // ============================================================
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text || !currentUser.username) return;

            try {
                const { data: userData } = await db.from('users').select('is_banned').eq('username', currentUser.username).single();
                if (userData && userData.is_banned) { alert('⛔ 你已被封禁，无法发送消息'); logout(); return; }
            } catch (_) { alert('⛔ 网络异常，请稍后再试'); return; }

            if (containsBlockedText(text)) { alert('⚠️ 消息包含违规内容，无法发送。'); return; }
            if (text.length > 10000) { alert('⚠️ 消息过长，请控制在10000字符以内'); return; }

            if (text.startsWith('@ai ')) {
                const prompt = text.slice(4);
                input.value = '';

                // 获取最近 20 条消息作为上下文
                let context = '';
                try {
                    const { data: recentMsgs } = await db.from('messages')
                        .select('username, content')
                        .eq('room', currentRoom)
                        .order('created_at', { ascending: false })
                        .limit(20);
                    if (recentMsgs) {
                        context = recentMsgs.reverse().map(m => `${m.username}: ${m.content}`).join('\n');
                    }
                } catch (e) { console.warn('获取上下文失败', e); }

                const reply = await askAI(prompt, context);

                // AI 回复入库
                try {
                    await db.from('messages').insert({
                        room: currentRoom,
                        username: '🤖 AI助手',
                        content: reply,
                        type: 'text',
                        avatar: '',
                        room_owner: currentRoom !== '大厅' ? roomOwners[currentRoom] || currentUser.username : null,
                        created_at: new Date().toISOString()
                    });
                } catch (insertErr) { console.warn('AI回复入库失败', insertErr); }

                input.focus();
                return;
            }

            try {
                const { error } = await db.from('messages').insert({
                    room: currentRoom,
                    username: currentUser.username,
                    content: text,
                    type: 'text',
                    avatar: currentUser.avatar || '',
                    room_owner: currentRoom !== '大厅' ? roomOwners[currentRoom] || currentUser.username : null
                });
                if (error) throw error;
                input.value = '';
                input.focus();
            } catch (err) { alert('发送失败：' + err.message); }
        }

        // ============================================================
        // AI 集成（Kimi 优先，Hugging Face 备选，含上下文）
        // ============================================================
        async function askAI(prompt, context) {
            const truncatedContext = context ? context.substring(0, 1000) : '';
            const fullMsg = `你是星迹聊天室的智能助手"星迹AI"。当前聊天室：${currentRoom}\n以下是最近聊天记录：\n${truncatedContext}\n\n用户 ${currentUser.username} 说：${prompt}\n请用简洁友好的中文回答。`;

            // 1. Kimi
            try {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 15000);
                const res = await fetch('https://api.moonshot.cn/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + KIMI_API_KEY },
                    body: JSON.stringify({ model: 'moonshot-v1-8k', messages: [{ role: 'user', content: fullMsg }], temperature: 0.7 }),
                    signal: controller.signal
                });
                clearTimeout(timeout);
                if (!res.ok) throw new Error('Kimi API error');
                const data = await res.json();
                const reply = data.choices && data.choices[0] && data.choices[0].message ? data.choices[0].message.content : '';
                if (reply) return reply;
            } catch (e) { console.warn('Kimi API 失败，尝试 Hugging Face'); }

            // 2. Hugging Face
            const hfToken = localStorage.getItem('hf_token');
            if (hfToken) {
                try {
                    const controller = new AbortController();
                    const timeout = setTimeout(() => controller.abort(), 15000);
                    const res = await fetch('https://api-inference.huggingface.co/models/Qwen/Qwen2.5-7B-Instruct', {
                        method: 'POST',
                        headers: { 'Authorization': 'Bearer ' + hfToken, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ inputs: fullMsg }),
                        signal: controller.signal
                    });
                    clearTimeout(timeout);
                    if (!res.ok) throw new Error('HF API error');
                    const data = await res.json();
                    if (data && data.generated_text) {
                        return data.generated_text.replace(fullMsg, '').trim() || '（AI 返回为空）';
                    }
                } catch (e) { console.warn('Hugging Face 调用失败'); }
            }

            // 3. 兜底
            return '🌙 所有 AI 服务暂时不可用，请稍后再试。';
        }

        // ============================================================
        // 搜索
        // ============================================================
        function searchMessages() {
            const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
            if (!keyword) return;
            loadMessages(currentRoom, true);
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('chatMessages').innerHTML = '';
            currentPage = 0;
            hasMoreMessages = true;
            oldestMessageCreatedAt = null;
            const trigger = document.createElement('div');
            trigger.className = 'load-more-trigger';
            trigger.id = 'loadMoreTrigger';
            trigger.textContent = '⬆ 滚动加载更早消息';
            trigger.onclick = loadMoreMessages;
            trigger.style.display = 'block';
            document.getElementById('chatMessages').appendChild(trigger);
            setupScrollLoadMore();
            loadMessages(currentRoom, true);
        }

        // ============================================================
        // 文件上传
        // ============================================================
        document.getElementById('fileInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            if (file.size > 20 * 1024 * 1024) { alert('文件过大，请选择小于 20MB 的文件'); e.target.value = ''; return; }
            const reader = new FileReader();
            reader.onload = async (ev) => {
                const base64 = ev.target.result;
                const type = file.type.startsWith('image/') ? 'image' : 'file';
                if (type === 'image') {
                    const isNsfw = await isImageNSFW(base64);
                    if (isNsfw) { alert('🛡️ 图片审核未通过，可能包含不适宜内容。'); return; }
                }
                try {
                    await db.from('messages').insert({
                        room: currentRoom, username: currentUser.username, content: base64, type: type,
                        avatar: currentUser.avatar || '', room_owner: currentRoom !== '大厅' ? roomOwners[currentRoom] || currentUser.username : null
                    });
                    document.getElementById('messageInput').focus();
                } catch (err) { alert('文件上传失败：' + err.message); }
            };
            reader.readAsDataURL(file);
            e.target.value = '';
        });

        function uploadAvatar() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.style.display = 'none';
            document.body.appendChild(input);
            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (file.size > 2 * 1024 * 1024) { alert('头像图片请小于 2MB'); return; }
                const reader = new FileReader();
                reader.onload = async (ev) => {
                    const base64 = ev.target.result;
                    const isNsfw = await isImageNSFW(base64);
                    if (isNsfw) { alert('🛡️ 头像审核未通过，请更换图片。'); return; }
                    currentUser.avatar = base64;
                    await db.from('users').update({ avatar: currentUser.avatar }).eq('username', currentUser.username);
                    document.getElementById('myAvatar').src = base64;
                    document.getElementById('sigAvatarPreview').src = base64;
                    updateMemberList();
                    input.remove();
                };
                reader.readAsDataURL(file);
            };
            input.click();
        }

        // ============================================================
        // 成员列表（修复：5分钟窗口 + 30秒刷新 + 点击交互）
        // ============================================================
        async function updateMemberList() {
            const fiveMinutesAgo = new Date(Date.now() - 5 * 60 * 1000).toISOString();
            const { data } = await db.from('messages')
                .select('username, avatar')
                .eq('room', currentRoom)
                .gte('created_at', fiveMinutesAgo)
                .order('created_at', { ascending: false })
                .limit(50);
            const members = new Map();
            if (data) { data.forEach(m => { if (!members.has(m.username)) members.set(m.username, m.avatar || ''); }); }
            if (!members.has(currentUser.username)) members.set(currentUser.username, currentUser.avatar || '');

            const list = document.getElementById('memberList');
            list.innerHTML = '';
            members.forEach((avatar, username) => {
                const tag = document.createElement('span');
                tag.className = 'member-tag';
                tag.innerHTML = `<img class="avatar avatar-sm" src="${getAvatarUrl(username, avatar)}" /> ${escapeHtml(username)} <span class="online-dot"></span>`;
                tag.title = '单击：视频通话 | 双击：私聊';
                tag.onclick = () => { if (username !== currentUser.username) startCallTo(username); };
                tag.ondblclick = () => { if (username !== currentUser.username) openPrivateChat(username); };
                list.appendChild(tag);
            });
        }

        // ============================================================
        // 个人资料
        // ============================================================
        async function showProfile(username) {
            const { data } = await db.from('users').select('username, avatar, signature, is_banned, last_login_at, last_device').eq('username', username).single();
            if (data) {
                const isBanned = data.is_banned || false;
                const { data: recentMsgs } = await db.from('messages').select('content, created_at').eq('username', username).order('created_at', { ascending: false }).limit(5);
                let recentHtml = '';
                if (recentMsgs && recentMsgs.length > 0) {
                    recentHtml = recentMsgs.map(m => `<div style="font-size:0.8rem;color:var(--text-secondary);padding:2px 0;">${escapeHtml(m.content).substring(0,40)} <span style="font-size:0.6rem;color:var(--text-muted);">${formatTime(m.created_at)}</span></div>`).join('');
                }
                document.getElementById('profileContent').querySelector('.modal-body').innerHTML = `
                    <div class="text-center">
                      <img src="${getAvatarUrl(username, data.avatar)}" class="avatar avatar-lg" style="margin:0 auto 12px;display:block;" />
                      <h3>${escapeHtml(username)} ${isBanned ? '<span style="background:#e74c3c;color:#fff;font-size:0.6rem;padding:2px 8px;border-radius:999px;margin-left:6px;">已封禁</span>' : ''}</h3>
                      <p class="text-secondary">${escapeHtml(data.signature || '这个人很懒，什么都没写～')}</p>
                      <div style="font-size:0.8rem;color:var(--text-muted);margin-top:8px;">
                        <div>📱 最后登录: ${data.last_login_at ? formatFullTime(data.last_login_at) : '未知'}</div>
                        <div>📟 设备: ${escapeHtml(data.last_device || '未知')}</div>
                      </div>
                      ${recentHtml ? `<div style="margin-top:12px;text-align:left;"><strong style="font-size:0.8rem;color:var(--text-secondary);">最近消息:</strong>${recentHtml}</div>` : ''}
                      <button class="btn btn-secondary" onclick="closeModal('profileModal')" style="margin-top:16px;">关闭</button>
                    </div>`;
                openModal('profileModal');
            }
        }

        // ============================================================
        // 私聊
        // ============================================================
        function openPrivateChat(target) {
            if (target === currentUser.username) return;
            privateTarget = target;
            wsChannels = wsChannels.filter(ch => {
                const chName = ch.topic || ch.channelName || '';
                if (chName.includes('private_messages')) { try { db.removeChannel(ch); } catch (_) {} return false; }
                return true;
            });
            document.getElementById('privateChatTitle').textContent = '💬 私聊 · ' + target;
            document.getElementById('privateChatMessages').innerHTML = '';
            loadPrivateMessages(target);
            subscribePrivateMessages();
            openModal('privateChatModal');
            setTimeout(() => document.getElementById('privateChatInput').focus(), 300);
        }

        async function loadPrivateMessages(target) {
            const { data } = await db.from('private_messages').select('*').or(`sender.eq.${currentUser.username},receiver.eq.${currentUser.username}`).order('created_at', { ascending: true });
            if (data) {
                const box = document.getElementById('privateChatMessages');
                box.innerHTML = '';
                data.filter(m => (m.sender === currentUser.username && m.receiver === target) || (m.sender === target && m.receiver === currentUser.username)).forEach(m => appendPrivateMessage(m, m.sender === currentUser.username));
                box.scrollTop = box.scrollHeight;
            }
        }

        function subscribePrivateMessages() {
            const ch = db.channel('private_messages-' + currentUser.username + '-' + privateTarget)
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'private_messages' }, payload => {
                    const msg = payload.new;
                    if ((msg.sender === currentUser.username && msg.receiver === privateTarget) || (msg.sender === privateTarget && msg.receiver === currentUser.username)) {
                        appendPrivateMessage(msg, msg.sender === currentUser.username);
                        const box = document.getElementById('privateChatMessages');
                        if (box) box.scrollTop = box.scrollHeight;
                        if (msg.sender !== currentUser.username) playSound();
                    }
                })
                .subscribe();
            wsChannels.push(ch);
        }

        async function sendPrivateMessage() {
            const input = document.getElementById('privateChatInput');
            const text = input.value.trim();
            if (!text || !privateTarget) return;
            if (containsBlockedText(text)) { alert('⚠️ 消息包含违规内容，无法发送。'); return; }
            try {
                await db.from('private_messages').insert({ sender: currentUser.username, receiver: privateTarget, content: text });
                input.value = '';
                input.focus();
            } catch (err) { alert('私聊发送失败：' + err.message); }
        }

        function appendPrivateMessage(msg, isSelf) {
            const box = document.getElementById('privateChatMessages');
            if (!box) return;
            const div = document.createElement('div');
            div.className = 'msg ' + (isSelf ? 'self' : 'other');
            div.style.maxWidth = '85%';
            const timeStr = msg.created_at ? formatTime(msg.created_at) : '';
            const fullDateStr = msg.created_at ? formatFullTime(msg.created_at) : '';
            div.innerHTML = `
                <img class="avatar avatar-sm" src="${getAvatarUrl(msg.sender, '')}" />
                <div class="msg-content">
                  ${!isSelf ? `<div class="msg-username">${escapeHtml(msg.sender)}</div>` : ''}
                  <div class="msg-text">${escapeHtml(msg.content)}</div>
                  <div class="msg-time">${timeStr}<span class="full-date">${fullDateStr}</span></div>
                </div>`;
            box.appendChild(div);
        }

        // ============================================================
        // 表情面板
        // ============================================================
        function toggleEmojiPanel() {
            const panel = document.getElementById('emojiPanel');
            if (panel.style.display === 'block') { panel.style.display = 'none'; } else {
                panel.style.display = 'block';
                document.getElementById('emojiGrid').innerHTML = emojis.map(e => `<span onclick="insertEmoji('${e}')">${e}</span>`).join('');
            }
        }

        function insertEmoji(emoji) {
            const privateModal = document.getElementById('privateChatModal');
            const isPrivateOpen = privateModal.classList.contains('active') && privateModal.style.display !== 'none';
            if (isPrivateOpen) {
                const privateInput = document.getElementById('privateChatInput');
                privateInput.value += emoji; privateInput.focus();
            } else {
                const mainInput = document.getElementById('messageInput');
                mainInput.value += emoji; mainInput.focus();
            }
        }

        // ============================================================
        // 视频通话（修复：从成员列表直接发起，不再 prompt）
        // ============================================================
        function startCallFromInput() {
            const target = prompt('📞 输入对方用户名：');
            if (target && target !== currentUser.username) startCallTo(target);
        }

        async function startCallTo(target) {
            if (!target || target === currentUser.username) return;
            callTarget = target;
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
                document.getElementById('localVideo').srcObject = localStream;
                document.getElementById('videoCallModal').classList.add('active');
                document.getElementById('videoCallModal').style.display = 'flex';
                pc = new RTCPeerConnection();
                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
                pc.ontrack = (e) => { document.getElementById('remoteVideo').srcObject = e.streams[0]; };
                pc.onicecandidate = (e) => { if (e.candidate) db.from('calls').insert({ sender: currentUser.username, receiver: target, type: 'ice', data: e.candidate, created_at: new Date().toISOString() }); };
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                await db.from('calls').insert({ sender: currentUser.username, receiver: target, type: 'offer', data: offer, created_at: new Date().toISOString() });
            } catch (_) { alert('无法访问摄像头/麦克风，请检查权限设置。'); }
        }

        function startCall() { startCallFromInput(); }

        function subscribeCalls() {
            const ch = db.channel('public:calls-' + currentUser.username)
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'calls', filter: 'receiver=eq.' + currentUser.username }, async payload => {
                    const msg = payload.new;
                    if (msg.receiver !== currentUser.username) return;
                    try {
                        if (msg.type === 'offer') {
                            if (!confirm('📞 ' + msg.sender + ' 邀请你视频通话，是否接听？')) {
                                await db.from('calls').insert({ sender: currentUser.username, receiver: msg.sender, type: 'hangup', data: {}, created_at: new Date().toISOString() });
                                return;
                            }
                            pc = new RTCPeerConnection();
                            localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
                            document.getElementById('localVideo').srcObject = localStream;
                            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
                            pc.ontrack = (e) => { document.getElementById('remoteVideo').srcObject = e.streams[0]; };
                            pc.onicecandidate = (e) => { if (e.candidate) db.from('calls').insert({ sender: currentUser.username, receiver: msg.sender, type: 'ice', data: e.candidate, created_at: new Date().toISOString() }); };
                            await pc.setRemoteDescription(new RTCSessionDescription(msg.data));
                            const answer = await pc.createAnswer();
                            await pc.setLocalDescription(answer);
                            await db.from('calls').insert({ sender: currentUser.username, receiver: msg.sender, type: 'answer', data: answer, created_at: new Date().toISOString() });
                            document.getElementById('videoCallModal').classList.add('active');
                            document.getElementById('videoCallModal').style.display = 'flex';
                            callTarget = msg.sender;
                        } else if (msg.type === 'answer') {
                            if (pc) await pc.setRemoteDescription(new RTCSessionDescription(msg.data));
                        } else if (msg.type === 'ice') {
                            if (pc) await pc.addIceCandidate(new RTCIceCandidate(msg.data));
                        } else if (msg.type === 'hangup') {
                            alert(msg.sender + ' 已挂断通话');
                            hangUp();
                        }
                    } catch (e) { console.warn('Call error:', e); }
                })
                .subscribe();
            wsChannels.push(ch);
        }

        function hangUp() {
            if (callTarget) {
                try { db.from('calls').insert({ sender: currentUser.username, receiver: callTarget, type: 'hangup', data: {}, created_at: new Date().toISOString() }); } catch (_) {}
            }
            if (pc) { pc.close(); pc = null; }
            if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
            const remoteVideo = document.getElementById('remoteVideo');
            const localVideo = document.getElementById('localVideo');
            if (remoteVideo) remoteVideo.srcObject = null;
            if (localVideo) localVideo.srcObject = null;
            document.getElementById('videoCallModal').classList.remove('active');
            document.getElementById('videoCallModal').style.display = 'none';
            callTarget = '';
        }

        // ============================================================
        // 主题 / 声音
        // ============================================================
        function toggleTheme() {
            document.body.classList.toggle('light');
            try { localStorage.setItem('starry_theme', document.body.classList.contains('light') ? 'light' : 'dark'); } catch (_) {}
        }
        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('soundToggle').textContent = soundEnabled ? '🔔' : '🔕';
        }
        try { if (localStorage.getItem('starry_theme') === 'light') document.body.classList.add('light'); } catch (_) {}

        // ============================================================
        // 键盘事件
        // ============================================================
        document.getElementById('messageInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.isComposing && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });
        document.getElementById('privateChatInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); sendPrivateMessage(); }
        });
        document.querySelectorAll('.modal-overlay').forEach(overlay => {
            overlay.addEventListener('click', (e) => { if (e.target === overlay) { overlay.classList.remove('active'); overlay.style.display = 'none'; } });
        });

        window.addEventListener('popstate', function(event) {
            const room = event.state?.room;
            if (room && room !== currentRoom) {
                if (room === '大厅') { checkAndSwitchRoom('大厅'); } else {
                    db.from('messages').select('room').eq('room', room).limit(1).then(({ data }) => {
                        if (data && data.length > 0) { checkAndSwitchRoom(room); } else {
                            window.history.pushState({ room: '大厅' }, '', '/starrychat/');
                            checkAndSwitchRoom('大厅');
                        }
                    });
                }
            }
        });

        // ============================================================
        // 启动
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            autoLogin();
        });
    </script>
